name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly Monday 06:00 UTC — catches drift between exit.generated.ts and
    # the live executor even when nothing in this repo changed (e.g. the
    # executor repo redeployed and nobody re-ran sync:exit-config here).
    - cron: "0 6 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Typecheck, tests, build
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' # schedule trigger exists only for exit-config-drift
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # .npmrc carries legacy-peer-deps=true (wagmi@3 declares peerOptional
      # typescript >=5.9.3 while the repo pins ~5.8). Pass it explicitly so a
      # strict `npm ci` cannot ERESOLVE if that file ever moves.
      - run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run lint

      - name: API + app tests
        run: npm test

      - name: Scoring engine tests
        run: npm run test:scoring

      - name: Production build
        run: npm run build

  contracts:
    name: Foundry
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' # schedule trigger exists only for exit-config-drift
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # forge-std is a submodule; without this, build fails

      - uses: foundry-rs/foundry-toolchain@v1

      - name: forge build
        working-directory: contracts
        run: forge build

      - name: forge test
        working-directory: contracts
        run: forge test -vvv

  executor:
    name: Executor (Hardhat)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' # schedule trigger exists only for exit-config-drift
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: executor/package-lock.json

      # executor/ is its own npm package with its own lockfile — no workspace
      # link to the app, and no .npmrc legacy-peer-deps needed here.
      - name: Install
        working-directory: executor
        run: npm ci

      - name: Compile
        working-directory: executor
        run: npx hardhat compile

      # Only the mock suite. test/fork/ forks Base mainnet and needs
      # BASE_MAINNET_RPC (an archive-node key), so it cannot run on a PR from
      # a fork; run it manually before a mainnet deploy.
      - name: Test (mock suite)
        working-directory: executor
        run: npx hardhat test test/executor.spec.ts

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' # schedule trigger exists only for exit-config-drift
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks needs history to scan the diff

      # The gitleaks BINARY is free; only the v2 Action wrapper requires a paid
      # licence for organisation accounts ("[org] is an organization. License
      # key is required."). Run the binary directly instead.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # --redact so a hit never prints the secret into a public build log.
      - name: Scan history for secrets
        run: gitleaks detect --source . --redact --no-banner

  exit-config-drift:
    name: Exit config drift
    runs-on: ubuntu-latest
    # Runs on the weekly schedule (always), or on a PR that touches the
    # generated exit config or the scripts that produce/verify it.
    if: github.event_name == 'schedule' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need base/head history to diff changed paths on PRs

      - name: Decide whether this run needs to verify
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Scheduled run — always verifying, regardless of what changed."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")
          echo "Changed files:"
          echo "$changed"
          if echo "$changed" | grep -qE '^(src/panik-core/lib/exit\.generated\.ts|scripts/.*exit-config.*|executor/deploy/onchain-config\.json)$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No exit-config-relevant paths changed — skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 24
          cache: npm

      - run: npm ci --legacy-peer-deps
        if: steps.gate.outputs.run == 'true'

      # verify-exit-config.mjs exits 1 on confirmed drift and 2 when the RPC
      # could not be reached. Both are treated as job failure here, including
      # on the scheduled run — a network hiccup silently skipping the weekly
      # check would defeat the point of having it. A flaky run just means a
      # re-run; a silently-skipped drift check means nobody finds out.
      - name: Verify exit config against live chain
        if: steps.gate.outputs.run == 'true'
        run: npm run verify:exit-config
