    <meta property="og:title" content="PANIK" />
    <meta property="og:description" content="Liquidation risk scoring and early warning for DeFi lending positions." />

         see scripts that generated it noted in the PR. summary_large_image is the
         Twitter/X card shape a 1200x630 image is meant for; "summary" would crop
         it down to a thumbnail. -->
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PANIK" />
    <meta name="twitter:description" content="Liquidation risk scoring and early warning for DeFi lending positions." />
    <meta name="twitter:image" content="/og-image.png" />
