[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
# Pinned explicitly: the EVM version is baked into the metadata hash, so
# letting solc pick its own default would silently change the deployed
# bytecode (and break Basescan verification) on a compiler bump.
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false

# Base mainnet for fork testing
[rpc_endpoints]
base = "https://mainnet.base.org"
base_sepolia = "https://sepolia.base.org"

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
